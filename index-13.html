<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English → Hausa Dictionary</title><style>body{font-family:Arial;margin:0;background:#f2f2f2}.header{background:#075e54;color:#fff;padding:20px;text-align:center}main{max-width:700px;margin:auto;padding:16px}.card{background:#fff;padding:16px;margin:12px 0;border-radius:16px}form{display:flex;gap:8px;flex-wrap:wrap}input{flex:1;min-width:180px;padding:13px;border:1px solid #ccc;border-radius:12px;font-size:16px}button{padding:12px 16px;border:0;border-radius:12px;background:#075e54;color:#fff}.result{font-size:21px;margin-top:15px}.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.word{padding:10px;border:1px solid #ddd;border-radius:10px}</style></head><body><header class="header"><h1>📖 English → Hausa Dictionary</h1><p>🔊 Karanta • 🎤 Yi magana • ➕ Ƙara kalma</p></header><main><section class="card"><form id="search"><input id="q" placeholder="Rubuta English word..."><button>🔎 Nemo</button></form><div id="result" class="result">Rubuta kalma domin neman fassara.</div><div class="actions"><button type="button" id="speak">🔊 Karanta Hausa</button><button type="button" id="mic">🎤 Yi Magana</button></div><p id="status"></p></section><section class="card"><h2>➕ Ƙara Kalma</h2><form id="add"><input id="en" placeholder="English"><input id="ha" placeholder="Hausa"><button>Ajiye</button></form></section><section class="card"><h2>📚 Kalmomi</h2><p>Jimillar kalmomi: <b id="count"></b></p><div id="list" class="list"></div></section></main><script>
const d={hello:'Sannu',hi:'Sannu','thank you':'Na gode',please:'Don Allah',sorry:'Yi hakuri',yes:'Eh',no:"A'a",welcome:'Barka da zuwa',friend:'Aboki',mother:'Uwa',father:'Uba',brother:'Dan uwa',sister:'Yar uwa',child:'Yaro',book:'Littafi',school:'Makaranta',teacher:'Malami',student:'Dalibi',house:'Gida',phone:'Waya',computer:'Kwamfuta',internet:'Intanet',website:'Shafin yanar gizo',water:'Ruwa',food:'Abinci',rice:'Shinkafa',bread:'Gurasa',milk:'Madara',meat:'Nama',fish:'Kifi',money:'Kudi',work:'Aiki',market:'Kasuwa',car:'Mota',train:'Jirgin kasa',airplane:'Jirgin sama',road:'Hanya',city:'Birni',country:'Kasa',world:'Duniya',day:'Rana',night:'Dare',today:'Yau',tomorrow:'Gobe',yesterday:'Jiya',one:'Daya',two:'Biyu',three:'Uku',four:'Hudu',five:'Biyar',six:'Shida',seven:'Bakwai',eight:'Takwas',nine:'Tara',ten:'Goma',big:'Babba',small:'Karami',good:'Mai kyau',bad:'Mara kyau',new:'Sabo',old:'Tsoho',hot:'Zafi',cold:'Sanyi',fast:'Da sauri',slow:'A hankali',beautiful:'Kyakkyawa',help:'Taimako',learn:'Koya',teach:'Koyar',write:'Rubuta',read:'Karanta',speak:'Yi magana',listen:'Saurara',come:'Zo',go:'Je',eat:'Ci',drink:'Sha',sleep:'Yi barci','how are you':'Yaya kake?','i am fine':'Ina lafiya','what is your name':'Menene sunanka?','where are you':'Ina kake?','good morning':'Ina kwana','good night':'Sai anjima'};
const q=document.getElementById('q'),r=document.getElementById('result'),status=document.getElementById('status');let current='';
function show(x){let k=x.trim().toLowerCase();if(d[k]){current=d[k];r.innerHTML='<b>'+k+'</b> → '+current}else{current='';r.innerHTML='❌ Ba a sami <b>'+k+'</b> ba.'}}
document.getElementById('search').onsubmit=e=>{e.preventDefault();show(q.value)};
document.getElementById('speak').onclick=()=>{if(!current){status.textContent='Da farko ka nemo kalma.';return}let u=new SpeechSynthesisUtterance(current);u.lang='ha-NG';speechSynthesis.speak(u);status.textContent='🔊 Ana karantawa...'};
document.getElementById('add').onsubmit=e=>{e.preventDefault();let a=en.value.trim().toLowerCase(),b=ha.value.trim();if(!a||!b)return;d[a]=b;en.value='';ha.value='';q.value=a;show(a);render();status.textContent='✅ An ƙara kalmar.'};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){let rec=new SR();rec.lang='en-US';rec.onresult=e=>{let t=e.results[0][0].transcript;q.value=t;show(t)};document.getElementById('mic').onclick=()=>{try{rec.start()}catch(e){}}}else document.getElementById('mic').onclick=()=>status.textContent='Speech recognition bai samu ba.';
function render(){let keys=Object.keys(d).sort();count.textContent=keys.length;list.innerHTML=keys.map(k=>'<div class="word"><b>'+k+'</b><br>'+d[k]+'</div>').join('')}render();
</script></body></html>
